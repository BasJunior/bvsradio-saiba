# BVS Live Phase 1 — beta media-origin template only.
# Pin stable SRS v6.0-r1 / 6.0.191 (and the resolved image digest) at VPS preflight.
# HAProxy owns public TLS/443. SRS only receives loopback plain RTMP.
# Do not deploy this on the production web VPS.

listen              127.0.0.1:1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HLS origin is loopback-only. Caddy exposes it through the TLS/SNI gateway.
http_server {
    enabled         on;
    listen          127.0.0.1:8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # Media-plane truth. HAProxy unwraps RTMPS, then SRS sees app=live and
    # stream=evt_xxx. The OBS sk secret remains in the publish param only.
    http_hooks {
        enabled      on;
        # The local hook relay injects Authorization before forwarding to beta Vercel.
        on_publish   http://127.0.0.1:9080/api/live/srs/on-publish;
        on_unpublish http://127.0.0.1:9080/api/live/srs/on-unpublish;
    }

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      12;
        hls_cleanup     on;
        hls_dispose     30;

        # Locked BVS viewer URL:
        # https://stream-beta.bvsradio.com/live/{public_id}/index.m3u8
        # The OBS secret can never enter this path.
        hls_m3u8_file   [app]/[stream]/index.m3u8;
        hls_ts_file     [app]/[stream]/segment-[seq].ts;
    }
}
