# BVS Live Phase 1 — beta media-origin template only.
# Secrets, certificates, DNS and host paths are runtime configuration.
# Do not deploy this on the production web VPS.

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # Media-plane truth. OBS publishes to app=live and stream=evt_xxx.
    http_hooks {
        enabled     on;
        # Stock SRS does not need to know the BVS hook secret. The local
        # loopback relay injects Authorization before forwarding to Vercel.
        on_publish  http://127.0.0.1:9080/api/live/srs/on-publish;
        on_unpublish http://127.0.0.1:9080/api/live/srs/on-unpublish;
    }

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      12;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
