# BVS Live Phase 1 — beta media-origin template only.
# Target SRS lane: v7+ (native RTMPS). Pin the exact image digest at VPS preflight.
# Secrets, certificates, DNS and host paths are runtime configuration.
# Do not deploy this on the production web VPS.

max_connections     1000;
daemon              off;
srs_log_tank        console;

# Plain RTMP is loopback-only. OBS uses RTMPS, never this listener directly.
rtmp {
    listen          127.0.0.1:1935;
}

# Native SRS RTMPS. The host/network layer maps public TCP/443 to this listener
# so OBS can use rtmps://ingest-beta.bvsradio.com/live without a port suffix.
rtmps {
    enabled         on;
    listen          1443;
    key             /etc/bvs-live/tls/privkey.pem;
    cert            /etc/bvs-live/tls/fullchain.pem;
}

# HLS is loopback/reverse-proxy origin traffic only. Caddy owns public HTTPS.
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # Media-plane truth. OBS publishes to app=live and stream=evt_xxx.
    http_hooks {
        enabled      on;
        # Stock SRS does not need to know the BVS hook secret. The local
        # loopback relay injects Authorization before forwarding to beta Vercel.
        on_publish   http://127.0.0.1:9080/api/live/srs/on-publish;
        on_unpublish http://127.0.0.1:9080/api/live/srs/on-unpublish;
    }

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      12;
        hls_cleanup     on;
        hls_dispose     30;

        # Locked BVS viewer URL:
        # https://stream-beta.bvsradio.com/live/{public_id}/index.m3u8
        # The OBS secret is only in param=?sk=... and can never enter this path.
        hls_m3u8_file   [app]/[stream]/index.m3u8;
        hls_ts_file     [app]/[stream]/segment-[seq].ts;
    }
}
