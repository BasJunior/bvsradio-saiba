# BVS Live Phase 1 — beta single-IP TLS/SNI gateway.
# Public TCP/443 terminates TLS here for both ingest-beta and stream-beta.
# Certificate material is runtime-only. Never commit private keys.

global
    log stdout format raw local0
    maxconn 2000

    # Runtime PEM directory. Each PEM may cover one hostname or both.
    # HAProxy selects the correct certificate by SNI.
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client  2h
    timeout server  2h

frontend bvs_live_tls_443
    bind :443 ssl crt /etc/haproxy/certs/ strict-sni

    acl sni_ingest ssl_fc_sni -i ingest-beta.bvsradio.com
    acl sni_stream ssl_fc_sni -i stream-beta.bvsradio.com

    use_backend bvs_live_ingest if sni_ingest
    use_backend bvs_live_hls if sni_stream

    # Unknown SNI is not part of the Phase 1 surface.
    tcp-request content reject if !sni_ingest !sni_stream

backend bvs_live_ingest
    # HAProxy has already removed TLS. SRS RTMP is loopback-only.
    server srs 127.0.0.1:1935 check

backend bvs_live_hls
    # HAProxy has already removed TLS. Caddy validates Host and adds CORS.
    server caddy 127.0.0.1:8081 check
