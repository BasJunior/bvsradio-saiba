<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><title>Reconnect · BVS Radio</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#0a0a0a;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:480px;border:1px solid #555;background:#1b1b1b;padding:32px}img{width:120px;height:auto}h1{font-size:clamp(32px,8vw,46px);line-height:1.05;letter-spacing:-.045em;margin:40px 0 16px}p{line-height:1.65;color:#bbb;margin:0 0 28px}.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c1a7ff;margin:28px 0 0}button{font:inherit;font-weight:700;min-height:48px;padding:12px 24px;color:#0a0a0a;background:#c4f343;border:1px solid #c4f343;cursor:pointer}button:focus-visible{outline:2px solid #c1a7ff;outline-offset:4px}
  </style>
</head>
<body><main><img src="/branding/bvs-logo.png" alt="BVS Radio" width="1032" height="552"><p class="label">Back in a moment</p><h1>Your next sound is waiting.</h1><p>You’re offline. Reconnect, then try again to keep exploring BVS.</p><button type="button" id="retry">Try again</button><p id="status" role="status" style="margin:20px 0 0;font-size:13px"></p></main><script>document.getElementById('retry').addEventListener('click',function(){if(!navigator.onLine){document.getElementById('status').textContent='Still offline. Check your connection and try again.';return;}window.location.reload();});</script></body>
</html>
