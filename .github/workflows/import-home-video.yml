name: Import corrected home video

on:
  push:
    branches: [fix/home-media-stage-quality]
    paths: [.github/workflows/import-home-video.yml]

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-media-stage-quality
      - name: Download corrected BVS homepage video
        shell: bash
        run: |
          python3 -m pip install --quiet requests
          python3 <<'PY'
          import re
          import requests
          import urllib.parse
          from pathlib import Path

          short_url = "https://we.tl/t-KmhALmehzP8Q7XQC"
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:122.0) Gecko/20100101 Firefox/122.0"

          resolved = requests.head(short_url, allow_redirects=True, headers={"User-Agent": user_agent}, timeout=30).url
          params = urllib.parse.urlparse(resolved).path.split("/")[2:]
          if len(params) == 2:
              transfer_id, security_hash = params
              recipient_id = None
          elif len(params) == 3:
              transfer_id, recipient_id, security_hash = params
          else:
              raise RuntimeError(f"Unexpected WeTransfer URL shape: {resolved}")

          session = requests.Session()
          session.headers.update({"User-Agent": user_agent, "x-requested-with": "XMLHttpRequest"})
          landing = session.get("https://wetransfer.com/", timeout=30)
          match = re.search(r'name="csrf-token" content="([^"]+)"', landing.text)
          if match:
              session.headers.update({"x-csrf-token": match.group(1)})

          payload = {"intent": "entire_transfer", "security_hash": security_hash}
          if recipient_id:
              payload["recipient_id"] = recipient_id
          response = session.post(
              f"https://wetransfer.com/api/v4/transfers/{transfer_id}/download",
              json=payload,
              timeout=30,
          )
          response.raise_for_status()
          direct_link = response.json().get("direct_link")
          if not direct_link:
              raise RuntimeError(f"WeTransfer did not return a direct link: {response.text[:300]}")

          target = Path("public/media/bvs-home-stage-loop.mp4")
          target.parent.mkdir(parents=True, exist_ok=True)
          with session.get(direct_link, stream=True, timeout=60) as download:
              download.raise_for_status()
              with target.open("wb") as handle:
                  for chunk in download.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          handle.write(chunk)

          expected_size = 1142854
          actual_size = target.stat().st_size
          if actual_size != expected_size:
              raise RuntimeError(f"Unexpected video size: {actual_size}, expected {expected_size}")
          print(f"Downloaded corrected video: {actual_size} bytes")
          PY
      - name: Validate video duration
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/media/bvs-home-stage-loop.mp4)"
          python3 - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 15.5 <= duration <= 15.7:
              raise SystemExit(f"Unexpected duration: {duration}")
          print(f"Validated duration: {duration:.3f}s")
          PY
      - name: Commit corrected binary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/bvs-home-stage-loop.mp4
          git commit -m "Replace truncated homepage video with full-quality asset"
          git push origin HEAD:fix/home-media-stage-quality
