name: Editorial connected playback patch

on:
  push:
    branches:
      - chatgpt/editorial-connected-playback-and-inline-edit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/editorial-connected-playback-and-inline-edit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/one-shot-editorial-connected-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify targeted regression
        run: npm run test:editorial-connected
      - name: Typecheck
        run: npm run typecheck
      - name: Full production build
        run: npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Saiba Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(editorial): connect review playback and inline metadata editing"
          git push origin HEAD:chatgpt/editorial-connected-playback-and-inline-edit
