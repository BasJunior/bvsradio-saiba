name: Editorial connected playback patch

on:
  push:
    branches:
      - chatgpt/editorial-connected-playback-and-inline-edit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/editorial-connected-playback-and-inline-edit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply connected playback and inline editing patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # Shared editorial playback control: one audio path, same persistent BVS player.
          Path('src/components/editorial/EditorialConnectedPreview.tsx').write_text(r'''\
'use client'

import { useStationPlayer } from '@/components/StationPlayer'

function formatTime(seconds: number) {
  if (!Number.isFinite(seconds) || seconds < 0) return '0:00'
  const whole = Math.floor(seconds)
  return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, '0')}`
}

export default function EditorialConnectedPreview({
  previewId,
  title,
  artist,
  src,
  artwork,
  project = 'Editorial review',
  genre,
  compact = false,
}: {
  previewId: string
  title: string
  artist: string
  src?: string | null
  artwork?: string | null
  project?: string
  genre?: string
  compact?: boolean
}) {
  const player = useStationPlayer()
  const active = Boolean(src) && player.current?.src === src && player.playingFrom === project
  const elapsed = active ? player.elapsed : 0
  const duration = active ? player.duration : 0
  const progress = duration > 0 ? Math.min(1, Math.max(0, elapsed / duration)) : 0

  if (!src) {
    return <div className="rounded-xl border border-dashed border-white/10 px-3 py-2 text-xs text-text-secondary">No preview audio attached.</div>
  }

  const toggle = () => {
    if (active) {
      player.toggle()
      return
    }
    player.playNow({
      id: '',
      title,
      artist,
      src,
      artwork: artwork || undefined,
      project,
      genre,
      isDownloadable: false,
      licenceType: 'not_for_sale',
    }, { from: project, related: [] })
  }

  return (
    <div data-editorial-connected-preview={previewId} className={`flex min-w-0 items-center gap-3 rounded-xl border border-white/10 bg-white/[.055] ${compact ? 'px-2.5 py-1.5' : 'px-3 py-2'}`}>
      <button
        type="button"
        onClick={toggle}
        className={`${compact ? 'h-9 w-9' : 'h-10 w-10'} grid shrink-0 place-items-center rounded-full bg-white text-sm font-black text-black`}
        aria-label={`${active && player.isPlaying ? 'Pause' : 'Preview'} ${title}`}
      >
        {active && player.isPlaying ? 'Ⅱ' : '▶'}
      </button>
      <span className="w-10 shrink-0 text-right text-[11px] tabular-nums text-text-secondary">{formatTime(elapsed)}</span>
      <input
        type="range"
        min="0"
        max="1000"
        value={Math.round(progress * 1000)}
        disabled={!active || duration <= 0}
        onChange={(event) => player.seek(Number(event.target.value) / 1000)}
        className="min-w-20 flex-1 accent-brand disabled:opacity-45"
        aria-label={`Seek ${title}`}
      />
      <span className="w-10 shrink-0 text-[11px] tabular-nums text-text-secondary">{duration > 0 ? `-${formatTime(Math.max(0, duration - elapsed))}` : '0:00'}</span>
    </div>
  )
}
''')

