name: BVS Live Lockfile Helper

on:
  push:
    branches:
      - chatgpt/bvs-live-phase1

permissions:
  contents: write

jobs:
  lock-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/bvs-live-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - run: npm run test:bvs-live-phase1
      - run: npm run test:safe-floor
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(beta): lock HLS playback dependency"
          git push origin HEAD:chatgpt/bvs-live-phase1
