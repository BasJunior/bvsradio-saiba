name: App navigation repair

on:
  push:
    branches:
      - chatgpt/app-navigation-repair

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/app-navigation-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply navigation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected fragment in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # AppBootstrap must not capture/cancel ordinary contained links. Next Link
          # can still intercept them later; without JS the anchor itself remains a fallback.
          replace(
              'src/components/app-vnext/AppBootstrap.tsx',
              'import { useRouter } from "next/navigation";\n',
              '',
          )
          replace(
              'src/components/app-vnext/AppBootstrap.tsx',
              'export default function AppBootstrap({ surface }: { surface: AppSurface }) {\n  const router = useRouter();\n\n  useEffect(() => {',
              'export default function AppBootstrap({ surface }: { surface: AppSurface }) {\n  useEffect(() => {',
          )
          replace(
              'src/components/app-vnext/AppBootstrap.tsx',
              '''      // Never let an in-app route become a full WebView document navigation.\n      // Keeping it inside Next's router preserves the vNext shell and prevents a\n      // malformed/missing child route from dropping the user into the web surface.\n      if (url.pathname === `/app/${surface}` || url.pathname.startsWith(`/app/${surface}/`)) {\n        event.preventDefault();\n        router.push(`${url.pathname}${url.search}${url.hash}`);\n        return;\n      }\n''',
              '''      // Contained app destinations must remain real links. When Next is hydrated\n      // its Link handler provides the SPA transition; if the WebView/router ever\n      // misses hydration, the browser still has a working href instead of a dead tap.\n      if (url.pathname === `/app/${surface}` || url.pathname.startsWith(`/app/${surface}/`)) {\n        return;\n      }\n''',
          )
          replace(
              'src/components/app-vnext/AppBootstrap.tsx',
              '      event.preventDefault();\n      router.push(destination);',
              '      event.preventDefault();\n      window.location.assign(destination);',
          )
          replace(
              'src/components/app-vnext/AppBootstrap.tsx',
              '  }, [router, surface]);',
              '  }, [surface]);',
          )

          # Marketplace navigation was JS-only buttons. Turn navigation into true links.
          replace(
              'src/components/app-vnext/AppMarketplaceClient.tsx',
              'import { useRouter } from "next/navigation";\n',
              '',
          )
          replace(
              'src/components/app-vnext/AppMarketplaceClient.tsx',
              '  const router = useRouter();\n',
              '',
          )
          replace(
              'src/components/app-vnext/AppMarketplaceClient.tsx',
              '''  const base = `/app/${surface}/marketplace`;\n  const openProvider = (slug: string) => router.push(`${base}?provider=${encodeURIComponent(slug)}`);\n  const openService = (providerSlug: string, serviceId: string, book = false) => {\n    const params = new URLSearchParams({ provider: providerSlug, service: serviceId });\n    if (book) params.set("book", "1");\n    router.push(`${base}?${params.toString()}`);\n  };\n''',
              '''  const base = `/app/${surface}/marketplace`;\n  const providerHref = (slug: string) => `${base}?provider=${encodeURIComponent(slug)}`;\n  const serviceHref = (providerSlug: string, serviceId: string, book = false) => {\n    const params = new URLSearchParams({ provider: providerSlug, service: serviceId });\n    if (book) params.set("book", "1");\n    return `${base}?${params.toString()}`;\n  };\n''',
          )
          replace(
              'src/components/app-vnext/AppMarketplaceClient.tsx',
              '<button type="button" onClick={() => router.push(base)} className="text-sm text-white/42 transition hover:text-white">← Marketplace</button>',
              '<Link href={base} className="inline-flex min-h-10 items-center text-sm text-white/42 transition hover:text-white">← Marketplace</Link>',
          )
          replace(
              'src/components/app-vnext/AppMarketplaceClient.tsx',
              '<button type="button" onClick={() => openService(provider.slug, item.id, true)} className="min-h-10 rounded-full bg-white px-4 text-sm font-semibold text-black transition hover:bg-brand">Check availability</button>',
              '<Link href={serviceHref(provider.slug, item.id, true)} className="inline-flex min-h-10 items-center rounded-full bg-white px-4 text-sm font-semibold text-black transition hover:bg-brand">Check availability</Link>',
          )
          replace(
              'src/components/app-vnext/AppMarketplaceClient.tsx',
              '<button type="button" onClick={() => openService(provider.slug, item.id)} className="min-h-10 rounded-full border border-brand/28 px-4 text-sm font-semibold text-brand transition hover:bg-brand/[.08]">View details</button>',
              '<Link href={serviceHref(provider.slug, item.id)} className="inline-flex min-h-10 items-center rounded-full border border-brand/28 px-4 text-sm font-semibold text-brand transition hover:bg-brand/[.08]">View details</Link>',
          )
          replace(
              'src/components/app-vnext/AppMarketplaceClient.tsx',
              '<button type="button" onClick={() => openProvider(item.slug)} className="min-h-10 rounded-full bg-white px-4 text-sm font-semibold text-black transition hover:bg-brand">View provider</button>',
              '<Link href={providerHref(item.slug)} className="inline-flex min-h-10 items-center rounded-full bg-white px-4 text-sm font-semibold text-black transition hover:bg-brand">View provider</Link>',
          )

          # Playlist navigation should also have an href fallback.
          replace(
              'src/components/app-vnext/AppPlaylistDetailClient.tsx',
              'import Image from "next/image";\n',
              'import Image from "next/image";\nimport Link from "next/link";\n',
          )
          replace(
              'src/components/app-vnext/AppPlaylistDetailClient.tsx',
              '<button type="button" onClick={() => router.back()} className="text-sm text-text-secondary">← Library</button>',
              '<Link href={`/app/${surface}/library`} className="inline-flex min-h-10 items-center text-sm text-text-secondary">← Library</Link>',
          )
          replace(
              'src/components/app-vnext/AppPlaylistDetailClient.tsx',
              '<button type="button" onClick={() => router.push(`/app/${surface}/explore`)} className="mt-4 rounded-full bg-brand px-5 py-3 text-sm font-semibold text-black">Explore music</button>',
              '<Link href={`/app/${surface}/explore`} className="mt-4 inline-flex min-h-11 items-center rounded-full bg-brand px-5 py-3 text-sm font-semibold text-black">Explore music</Link>',
          )

          # Update the iOS regression gate to enforce progressive, non-dead navigation.
          replace(
              'scripts/apple-ios-surface-tests.mjs',
              '''// Navigation guard must preserve the app shell for contained routes and externalise legal/licence destinations.\nassert(bootstrap.includes('window.localStorage.setItem("bvs_app_version", "vnext")'), 'bootstrap must identify vNext shell')\nassert(bootstrap.includes('router.push(`${url.pathname}${url.search}${url.hash}`)'), 'contained app routes must use Next router')\nassert(bootstrap.includes('isExternalLegalOrLicenceUrl(url)'), 'legal/licence destinations need external boundary')\nassert(bootstrap.includes('window.open(externalBvsUrl(url), "_blank", "noopener,noreferrer")'), 'external legal/licence links must leave the WebView')\nassert(externalBoundary.includes('bvsradio.com'), 'external boundary must target canonical BVS host')\n''',
              '''// Navigation must progressively enhance rather than capture-cancel contained links.\nassert(bootstrap.includes('window.localStorage.setItem("bvs_app_version", "vnext")'), 'bootstrap must identify vNext shell')\nassert(bootstrap.includes('url.pathname === `/app/${surface}` || url.pathname.startsWith(`/app/${surface}/`)'), 'bootstrap must recognize contained app routes')\nassert(!bootstrap.includes('router.push(`${url.pathname}${url.search}${url.hash}`)'), 'contained app links must retain their native href fallback')\nassert(bootstrap.includes('window.location.assign(destination)'), 'mapped legacy destinations must have a hard-navigation fallback')\nassert(bootstrap.includes('isExternalLegalOrLicenceUrl(url)'), 'legal/licence destinations need external boundary')\nassert(bootstrap.includes('window.open(externalBvsUrl(url), "_blank", "noopener,noreferrer")'), 'external legal/licence links must leave the WebView')\nassert(externalBoundary.includes('bvsradio.com'), 'external boundary must target canonical BVS host')\nassert(appMarketplace.includes('providerHref'), 'Marketplace providers must resolve to real href destinations')\nassert(appMarketplace.includes('<Link href={serviceHref(provider.slug, item.id)}'), 'Marketplace service details must be real links')\nassert(appMarketplace.includes('<Link href={serviceHref(provider.slug, item.id, true)}'), 'Marketplace availability must be a real link')\nassert(!appMarketplace.includes('onClick={() => openService'), 'Marketplace navigation must not depend on JS-only buttons')\nassert(appPlaylistDetail.includes('href={`/app/${surface}/library`}'), 'Playlist back navigation must keep an href fallback')\nassert(appPlaylistDetail.includes('href={`/app/${surface}/explore`}'), 'Empty-playlist explore navigation must keep an href fallback')\n''',
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify iOS navigation regression
        run: npm run test:apple-ios-surface
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit repair
        shell: bash
        run: |
          git rm .github/workflows/app-navigation-repair.yml
          git config user.name "Saiba Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/app-vnext/AppBootstrap.tsx src/components/app-vnext/AppMarketplaceClient.tsx src/components/app-vnext/AppPlaylistDetailClient.tsx scripts/apple-ios-surface-tests.mjs
          git commit -m "fix(app): make navigation resilient in native WebView"
          git push origin HEAD:chatgpt/app-navigation-repair
