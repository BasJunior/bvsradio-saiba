name: Native vNext

on:
  push:
    branches:
      - saiba/app-vnext-2026-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Regenerate Capacitor Android metadata
        env:
          BVS_MOBILE_SURFACE: android
        run: |
          mkdir -p out
          printf '<!doctype html><title>BVS native shell</title>' > out/index.html
          npx cap sync android
      - name: Compile Android debug shell
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate Capacitor iOS metadata
        env:
          BVS_MOBILE_SURFACE: ios
        run: |
          mkdir -p out
          printf '<!doctype html><title>BVS native shell</title>' > out/index.html
          npx cap sync ios
      - name: Compile iOS simulator shell
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
