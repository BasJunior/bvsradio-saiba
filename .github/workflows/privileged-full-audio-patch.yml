name: Privileged full audio patch

on:
  push:
    branches:
      - chatgpt/privileged-full-audio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/privileged-full-audio
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply privileged full-audio patch
        run: python scripts/one-shot-privileged-full-audio.py
      - name: Install dependencies
        run: npm ci
      - name: Verify privileged audio policy
        run: npm run test:privileged-audio
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Saiba Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f scripts/one-shot-privileged-full-audio.py .github/workflows/privileged-full-audio-patch.yml
          git add -A
          git commit -m "feat(audio): allow full playback for owners and editorial staff"
          git push origin HEAD:chatgpt/privileged-full-audio
