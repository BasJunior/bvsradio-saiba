name: BVS Studios Beta

on:
  push:
    branches:
      - saiba/beta-studio-discovery-2026-08-26

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: ${{ !contains(github.event.head_commit.message, '[studio-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow Studio Marketplace integration
        run: |
          node scripts/studio-marketplace-finalize.mjs
          node scripts/studio-marketplace-typefix.mjs
      - run: npm ci
      - run: npm run test:studio-marketplace
      - run: npm run test:beta-features
      - run: npm run test:bvs-live-state
      - run: npm run test:premium-growth
      - run: npm run test:staff-copilot
      - run: npm run typecheck
      - run: npm run build
      - name: Verify beta-only Vercel target guard
        env:
          VERCEL_PROJECT_ID: prj_gv9stqkz190faX23mT3dy3wWStEo
        run: |
          mkdir -p .vercel
          printf '{"orgId":"team_HYmWoU6WIW4IHXmh3mrB10Oq","projectId":"prj_gv9stqkz190faX23mT3dy3wWStEo"}\n' > .vercel/project.json
          npm run deploy:beta:guard
      - name: Commit finalized Studio Marketplace integration
        run: |
          git config user.name "BVS Studios Beta"
          git config user.email "83550884+BasJunior@users.noreply.github.com"
          git add package.json \
            src/app/marketplace/page.tsx \
            src/app/creator/marketplace/page.tsx \
            src/app/api/marketplace/route.ts \
            src/components/CreatorMarketplaceDesk.tsx \
            src/app/api/marketplace/bookings/route.ts \
            'src/app/marketplace/[slug]/book/page.tsx' \
            src/app/marketplace/studios/page.tsx
          if git diff --cached --quiet; then
            echo "Studio Marketplace integration already finalized."
            exit 0
          fi
          git commit -m "feat(beta): finalize BVS Studios discovery [studio-finalized]"
          git push origin HEAD:saiba/beta-studio-discovery-2026-08-26
