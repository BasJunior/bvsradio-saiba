name: BVS Live Lockfile Normalize

on:
  push:
    branches:
      - chatgpt/bvs-live-phase1

permissions:
  contents: write

jobs:
  normalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/bvs-live-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild minimal lockfile patch from beta baseline
        run: |
          git checkout 78b42b90233cf34f79f9f110888bd9cdc0eb8df2 -- package-lock.json
          python - <<'PY'
          from pathlib import Path
          p = Path('package-lock.json')
          s = p.read_text()
          root = '        "ai": "^6.0.226",\n'
          if root not in s:
              raise SystemExit('root dependency anchor missing')
          s = s.replace(root, root + '        "hls.js": "1.6.14",\n', 1)
          anchor = '    "node_modules/https-proxy-agent": {'
          if anchor not in s:
              raise SystemExit('package anchor missing')
          block = '''    "node_modules/hls.js": {\n      "version": "1.6.14",\n      "resolved": "https://registry.npmjs.org/hls.js/-/hls.js-1.6.14.tgz",\n      "integrity": "sha512-CSpT2aXsv71HST8C5ETeVo+6YybqCpHBiYrCRQSn3U5QUZuLTSsvtq/bj+zuvjLVADeKxoebzo16OkH8m1+65Q==",\n      "license": "Apache-2.0"\n    },\n'''
          s = s.replace(anchor, block + anchor, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run test:bvs-live-phase1
      - run: npm run test:safe-floor
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Commit minimal lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(beta): minimize HLS lockfile delta"
          git push origin HEAD:chatgpt/bvs-live-phase1
