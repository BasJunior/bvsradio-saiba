name: BVS Live Phase 1

on:
  push:
    branches:
      - chatgpt/bvs-live-phase1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:bvs-live-phase1
      - run: npm run test:show-lifecycle
      - run: npm run test:safe-floor
      - run: npm run typecheck
      - run: npm run build
